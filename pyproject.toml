[project]
name = "worktrees"
license = "Apache-2.0"
description = "Git worktree commands that refuse to lose work."
keywords = ["git", "worktree", "cli"]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
authors = [
    { name = "Mihai Bojin", email = "557584+MihaiBojin@users.noreply.github.com" },
]
# Static, and the single source of truth for the version. Bump it in a pull
# request and run `uv lock`; the release tag only has to agree with it.
version = "0.1.0"
# The standard library answers every question this asks. A dependency here
# would be paid on every invocation, and the whole reason this is Python is
# that an invocation costs ~25 ms.
dependencies = []
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    # keep-sorted start
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    # keep-sorted end
]

[project.urls]
"Bug reports" = "https://github.com/MihaiBojin/worktrees/issues/new"
"Source" = "https://github.com/MihaiBojin/worktrees"

# One venv, N names. `gwp` is the alias a person types; `worktrees` is the CLI
# a shim and an agent call.
[project.scripts]
gwnb = "worktrees.cli:gwnb"
gwp = "worktrees.cli:gwp"
gws = "worktrees.cli:gws"
worktrees = "worktrees.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worktrees"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# The whole set, not an addition to a default that moves between releases.
select = [
    # keep-sorted start
    "B",   # bugbear: mutable defaults, loop-variable capture
    "C4",  # comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "RUF", # ruff's own
    "SIM", # simplify
    "UP",  # pyupgrade
    "W",   # warnings
    # keep-sorted end
]

[tool.mypy]
# keep-sorted start
check_untyped_defs = true
disallow_untyped_calls = true
namespace_packages = false
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unused_ignores = true
# keep-sorted end
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
