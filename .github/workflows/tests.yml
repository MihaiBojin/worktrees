name: Tests

on:
  # Every pull request, not only those into main: a stacked branch targets the
  # one below it, and a filter on `main` leaves that pull request with no
  # checks at all.
  pull_request:
  push:
    branches:
      - main

# Least privilege: this reads the repository and nothing else. Without a
# default, GITHUB_TOKEN's scopes come from the repository setting, which is
# invisible from here.
permissions:
  contents: read

# A second push to a pull request cancels the run still going for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # ruff and mypy both run from here, so what CI checks and what a commit
      # checks are the same versions pinned in the same file.
      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      # One version failing is a fact about that version, so let the others
      # finish and say which.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # python-version makes setup-uv run `uv python install`, so each entry
      # gets a uv-managed cpython-X.Y.Z rather than whatever the runner image
      # ships. Packagers differ enough to matter: one that links its C
      # extensions into the executable and one that dlopens 76 of them do not
      # start in the same time. scripts/README.md has the measurement.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Install dependencies
        # --locked fails the run on a stale uv.lock, rather than quietly
        # resolving something the lock file never described.
        run: uv sync --all-extras --locked

      # Neither shell is on the image. Without them the nine assertions that
      # drive a real fish or zsh call pytest.skip, which is invisible in
      # `pytest -q`, so the run goes green without either shim ever running.
      - name: Install fish and zsh
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      # The suite drives real git: it builds repositories, adds worktrees and
      # removes them. Recording the version makes a failure that is git's
      # rather than ours readable from the log alone.
      - name: Record the git version
        run: git --version && fish --version && zsh --version

      - name: Run tests
        run: uv run --no-sync pytest tests -q
