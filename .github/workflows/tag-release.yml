name: Tag Release

# Releasing is merging a version bump. This reads `version` from pyproject.toml
# on every push to main and tags the commit when no such tag exists yet, so a
# push that does not change the version is a no-op.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      # Push the tag
      contents: write
      # Dispatch publish.yml against it
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag the release
        id: tag
        run: |
          # Assigned on its own line on purpose. `echo "tag=$(...)"` would
          # discard the script's exit status, since errexit only inspects
          # `echo`, so a rejected tag push would write an empty output, skip
          # the dispatch, and report "nothing to release" on a green run.
          TAG="$(scripts/tag-release.bash)"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN raises no `push: tags` event: GitHub
      # suppresses those to stop workflows recursing. workflow_dispatch is
      # exempt, so the pipeline is started explicitly against the new tag,
      # rather than keeping a long-lived PAT to make a tag push observable.
      - name: Publish the tagged release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG"

      - name: Report
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Released $TAG" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No version change; nothing to release." >>"$GITHUB_STEP_SUMMARY"
          fi
