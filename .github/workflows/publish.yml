name: Publish

# Renaming this file breaks publishing. PyPI's Trusted Publishing matches a
# request against the repository, this workflow's FILENAME and the environment,
# so a rename means re-registering the publisher on PyPI first.
#
#   build -> publish -> release
#                    \-> verify
#
# Nothing here creates a tag. A release is a version bump merged into main and
# then tagged by hand, so the irreversible step is the last one and everything
# before it is a normal reviewed change.
#
# There is no TestPyPI rehearsal. testpypi.yml publishes every commit on main
# there as <version>.post<epoch> and installs it back, so the tree this tag
# names has already proved it uploads to an index and installs from one. What
# is left to prove before the upload PyPI cannot take back is that the wheel
# runs, and build installs it and does that.
#
# No API token is stored anywhere. See docs/DEVELOPMENT.md, "Publishing a
# version".

on:
  push:
    tags:
      - "v*.*.*"
  # To re-run a release whose publish failed. Run it against a tag ref, not a
  # branch: every guard below reads the tag at HEAD.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Built once and handed to every job below, so what reaches PyPI is
  # byte-for-byte what was tested and installed here.
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Reading another workflow's runs. Without it the tests guard below
      # gets 403 from /actions/workflows/tests.yml and refuses every release,
      # which is the safe direction and still a release that cannot happen.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A tag-ref checkout fetches only the tag it is checking out, and
          # check-tag-version.bash asks for every tag at HEAD.
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Install the release tools
        uses: releasetools/cli@v0

      # Four guards, cheapest first. The tag has to name a version the
      # repository actually carries, that version has to have a changelog
      # entry, the commit has to be one main took, and its tests have to have
      # passed already. All of them here in build, because the release job
      # runs after the PyPI upload and a refusal there would be too late.
      - name: Check the tag matches the project version
        run: rt git::assert_tag_version "$(uv version --short)"

      - name: Check the changelog has an entry for it
        run: rt changelog::section "${GITHUB_REF_NAME#v}" >/dev/null

      # github:: rather than git::, because this checkout is shallow and
      # merge-base answers from the history it has: on a truncated one it
      # reports a commit main genuinely took as not on main, and refuses a
      # release that should go ahead. The API needs no local history.
      - name: Check the commit is on main
        env:
          # GH_REPO carries the value the runner publishes as GITHUB_REPOSITORY: gh looks for
          # GH_REPO and never at GITHUB_REPOSITORY. GITHUB_TOKEN is not a default variable at
          # all, so the token has to be handed over rather than renamed.
          GH_TOKEN: ${{ github.token }} # no runner default
          GH_REPO: ${{ github.repository }} # = $GITHUB_REPOSITORY; gh reads GH_REPO
        run: rt github::assert_on_branch main

      - name: Wait for the tests on this commit
        env:
          GH_TOKEN: ${{ github.token }} # no runner default
          GH_REPO: ${{ github.repository }} # = $GITHUB_REPOSITORY; gh reads GH_REPO
          SHA: ${{ github.sha }} # = $GITHUB_SHA
        run: rt github::await_workflow "$SHA" tests.yml

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Neither shell is on the image, and the shim tests fail rather than
      # skip under CI, so this job needs them exactly as tests.yml does.
      - name: Install fish and zsh
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      # The tag is the last chance to catch a regression, and it costs 20s.
      - name: Run tests
        run: uv run --no-sync pytest tests -q

      - name: Build
        run: uv build

      # The wheel is not the tree: hatch_build.py writes _version.py into it,
      # and one that lacks it falls back to the metadata lookup and says
      # nothing. Installing it costs four seconds and happens before anything
      # is uploaded anywhere.
      - name: Install the wheel and run it
        run: |
          REPORTED="$(uv tool run --isolated --from dist/*.whl gw version)"
          DECLARED="$(uv version --short)"
          echo "the wheel reports $REPORTED, pyproject declares $DECLARED" >&2
          [ "$REPORTED" = "$DECLARED" ]

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-26.04
    needs: build
    # Binds this job to the trusted publisher registered for `pypi`. Add a
    # required reviewer on this environment for a manual gate before anything
    # reaches the real index.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish --trusted-publishing always

  # Uploaded and installable are two claims with two timings, so they are two
  # jobs. An index serves what it has accepted only after a delay of its own
  # choosing: 0.2.1 took longer than the script waited, and a release that had
  # published correctly went red and had to be re-run by hand. This job holds
  # the second claim, `release` needs only the first, and a red `verify` says
  # PyPI is slow rather than that the version is not out.
  verify:
    name: Verify it installs from PyPI
    runs-on: ubuntu-26.04
    needs: publish
    permissions:
      contents: read
    steps:
      # The script reads the name and version from pyproject.toml through
      # `uv version`, and installs from the index rather than from the
      # artifact, so there is nothing to download here.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Verify it installs from PyPI
        run: scripts/verify-publish.bash --prod

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the release tools
        uses: releasetools/cli@v0

      # What was written for this version, not a list of pull request titles.
      # build already proved the section exists, before anything was published.
      - name: Read the changelog entry
        run: rt changelog::section "${GITHUB_REF_NAME#v}" >RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
