name: Publish
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Renaming this file breaks publishing. PyPI's Trusted Publishing matches a
# request against the repository, this workflow's FILENAME and the environment,
# so a rename means re-registering the publisher on PyPI first.
#
#   build -> tag -> publish -> release -> list
#                           \-> verify
#
# A release is a version bump merged into main, then published one of two
# ways, as .releasetools.yaml's release.trigger lists them. Pushing the signed
# tag v<version> on the release commit starts this workflow. Or a dispatch
# names the version and the release commit, and the tag job creates the tag
# once build has passed, before anything is uploaded. Either way the
# irreversible step is the last one and everything before it is a normal
# reviewed change.
#
# There is no TestPyPI rehearsal. testpypi.yml publishes every commit on main
# there as <version>.post<epoch> and installs it back, so the tree this tag
# names has already proved it uploads to an index and installs from one. What
# is left to prove before the upload PyPI cannot take back is that the wheel
# runs, and build installs it and does that.
#
# No PyPI token is stored anywhere. The one stored credential is the
# automation App's key, which list uses to reach the marketplace. See
# docs/DEVELOPMENT.md, "Publishing a version" and "Listing the plugin".

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, with no v (e.g. 0.9.1). The tag is v<version>."
        required: true
      commit:
        description: "The release commit: its full SHA, or HEAD for whatever the dispatched ref names when the run starts."
        required: false
        default: HEAD

permissions:
  contents: read

env:
  # The tag this run releases: the one pushed, or the one a dispatch creates.
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # Built once and handed to every job below, so what reaches PyPI is
  # byte-for-byte what was tested and installed here.
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reading another workflow's runs. Without it the tests guard below
      # gets 403 from /actions/workflows/tests.yml and refuses every release,
      # which is the safe direction and still a release that cannot happen.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A tag-ref checkout fetches only the tag it is checking out, and
          # check-tag-version.bash asks for every tag at HEAD.
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Install the release tools
        uses: releasetools/cli@v0

      # The guards, cheapest first. A dispatched run builds whatever its ref
      # names when it starts, so it has to be the commit the dispatch named,
      # and the tag it would create must not exist yet. The tag has to name a
      # version the repository actually carries, that version has to have a
      # changelog entry, the commit has to be one main took, and its tests
      # have to have passed already. All of them here in build, because the
      # release job runs after the PyPI upload and a refusal there would be
      # too late.
      - name: Refuse a commit other than the release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$COMMIT" != HEAD ] && [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::asked to release $COMMIT, but $GITHUB_REF_NAME is at $GITHUB_SHA"
            exit 1
          fi

      - name: Refuse a version already tagged
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }} # no runner default
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      - name: Check the tag matches the project version
        if: github.event_name == 'push'
        run: rt git::assert_tag_version "$(uv version --short)"

      - name: Check the dispatched version is the project version
        if: github.event_name == 'workflow_dispatch'
        run: |
          DECLARED="v$(uv version --short)"
          if [ "$DECLARED" != "$TAG" ]; then
            echo "::error::pyproject.toml declares $DECLARED, not $TAG"
            exit 1
          fi

      - name: Check the changelog has an entry for it
        run: rt changelog::section "${TAG#v}" >/dev/null

      # github:: rather than git::, because this checkout is shallow and
      # merge-base answers from the history it has: on a truncated one it
      # reports a commit main genuinely took as not on main, and refuses a
      # release that should go ahead. The API needs no local history.
      - name: Check the commit is on main
        env:
          # GH_REPO carries the value the runner publishes as GITHUB_REPOSITORY: gh looks for
          # GH_REPO and never at GITHUB_REPOSITORY. GITHUB_TOKEN is not a default variable at
          # all, so the token has to be handed over rather than renamed.
          GH_TOKEN: ${{ github.token }} # no runner default
          GH_REPO: ${{ github.repository }} # = $GITHUB_REPOSITORY; gh reads GH_REPO
        run: rt github::assert_on_branch main

      - name: Wait for the tests on this commit
        env:
          GH_TOKEN: ${{ github.token }} # no runner default
          GH_REPO: ${{ github.repository }} # = $GITHUB_REPOSITORY; gh reads GH_REPO
          SHA: ${{ github.sha }} # = $GITHUB_SHA
        run: rt github::await_workflow "$SHA" tests.yml

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Neither shell is on the image, and the shim tests fail rather than
      # skip under CI, so this job needs them exactly as tests.yml does.
      - name: Install fish and zsh
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      # This run is the last chance to catch a regression, so both suites run.
      - name: Run tests
        run: |
          uv run --no-sync pytest tests -q
          uv run --no-sync pytest tests -q -m integration

      - name: Build
        run: uv build

      # The wheel is not the tree: hatch_build.py writes _version.py into it,
      # and one that lacks it falls back to the metadata lookup and says
      # nothing. Installing it costs four seconds and happens before anything
      # is uploaded anywhere.
      - name: Install the wheel and run it
        run: |
          REPORTED="$(uv tool run --isolated --from dist/*.whl gw version)"
          DECLARED="$(uv version --short)"
          echo "the wheel reports $REPORTED, pyproject declares $DECLARED" >&2
          [ "$REPORTED" = "$DECLARED" ]

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # A dispatch tags the release commit here, after every guard and before the
  # upload, so a second dispatch of the same version stops at this step. The
  # tag is made with this run's GITHUB_TOKEN, which starts no workflow, so it
  # does not start this one a second time. A pushed tag skips this job.
  tag:
    name: Tag the release commit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }} # no runner default
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build, tag]
    # A pushed tag skips the tag job, and a job whose needs include a skipped
    # one is skipped too unless its condition says otherwise.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tag.result != 'failure' }}
    # Binds this job to the trusted publisher registered for `pypi`. Add a
    # required reviewer on this environment for a manual gate before anything
    # reaches the real index.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      # Sign with this job's OIDC identity. uv uploads the attestations with
      # their distributions.
      - name: Attest
        run: uvx pypi-attestations@0.0.30 sign dist/*

      - name: Publish
        run: uv publish --trusted-publishing always

  # PyPI can take time to serve an accepted upload. Verification runs in a
  # separate job so that delay does not block the GitHub release.
  verify:
    name: Verify PyPI install and attestations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Verify it installs from PyPI
        run: scripts/verify-publish.bash --prod

      # The filenames identify the distributions to fetch from PyPI.
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      # The install check resolves the wheel alone, so the sdist can still be
      # missing from PyPI here. A file PyPI does not serve yet is asked again,
      # backing off from 15s over eight attempts as the install check does;
      # any other failure ends the job at once.
      - name: Verify attestations on PyPI
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            file="${f#dist/}"
            delay=15
            for attempt in 1 2 3 4 5 6 7 8; do
              code=0
              uvx pypi-attestations@0.0.30 verify pypi \
                --repository "https://github.com/$GITHUB_REPOSITORY" "pypi:$file" 2>err.txt || code=$?
              cat err.txt >&2
              [ "$code" -ne 0 ] || break
              grep -q "Could not find the artifact" err.txt || exit 1
              [ "$attempt" -lt 8 ] || exit 1
              echo "waiting ${delay}s for PyPI to serve $file (attempt $attempt/8)..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          done

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the release tools
        uses: releasetools/cli@v0

      # What was written for this version, not a list of pull request titles.
      # build already proved the section exists, before anything was published.
      - name: Read the changelog entry
        run: rt changelog::section "${TAG#v}" >RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          make_latest: true

  # MihaiBojin/agent-plugins lists the agent plugin at a release tag, and a
  # client installs the tag that listing names. This job opens the pull
  # request that moves it to this one. GITHUB_TOKEN reaches no other
  # repository, so the job runs as the automation App; without the App's
  # GH_APP_CLIENT_ID it warns and changes nothing.
  list:
    name: List the plugin in the marketplace
    runs-on: ubuntu-24.04
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    env:
      MARKETPLACE: ${{ github.repository_owner }}/agent-plugins
    steps:
      - name: Warn that the App is not configured
        if: vars.GH_APP_CLIENT_ID == ''
        run: >-
          echo "::warning::GH_APP_CLIENT_ID is not set, so $MARKETPLACE still
          lists the previous tag. See docs/DEVELOPMENT.md, \"Listing the plugin\"."

      - name: Mint a token for the marketplace
        id: app-token
        if: vars.GH_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-plugins
          permission-contents: write
          permission-pull-requests: write

      # The release commit, for the description the plugin ships with.
      - name: Checkout code
        if: vars.GH_APP_CLIENT_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false

      - name: Checkout the marketplace
        if: vars.GH_APP_CLIENT_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.MARKETPLACE }}
          token: ${{ steps.app-token.outputs.token }}
          path: marketplace
          persist-credentials: false

      # The listing's ref and description, then both catalogs from them with
      # the marketplace's own sync script. The README's row is shorter
      # hand-written prose and stays as it is.
      - name: Point the listing at this tag
        id: bump
        if: vars.GH_APP_CLIENT_ID != ''
        working-directory: marketplace
        run: |
          set -euo pipefail
          description="$(jq -er .description ../source/plugin/.claude-plugin/plugin.json)"
          node -e '
            const fs = require("node:fs");
            const [tag, description] = process.argv.slice(1);
            const plugins = JSON.parse(fs.readFileSync("remote-plugins.json", "utf8"));
            const entry = plugins.find((plugin) => plugin.name === "worktrees");
            if (!entry) throw new Error("remote-plugins.json lists no worktrees");
            entry.ref = tag;
            entry.description = description;
            fs.writeFileSync("remote-plugins.json", JSON.stringify(plugins, null, 2) + "\n");
          ' "$TAG" "$description"
          node scripts/sync-catalogs.mjs
          if git diff --quiet; then
            echo "$MARKETPLACE already lists $TAG." >&2
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat
          staged="$RUNNER_TEMP/listing"
          git diff --name-only | while read -r file; do
            mkdir -p "$staged/$(dirname "$file")"
            cp "$file" "$staged/$file"
          done
          echo "staged=$staged" >>"$GITHUB_OUTPUT"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      # signed-push commits onto a branch that exists, so the branch starts at
      # the marketplace's main. A rerun finds it: with its pull request open
      # it goes on to the merge, and without one a person decides.
      - name: Create the branch
        id: branch
        if: steps.bump.outputs.changed == 'true'
        working-directory: marketplace
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="worktrees-$TAG"
          echo "name=$branch" >>"$GITHUB_OUTPUT"
          if gh api "repos/$MARKETPLACE/git/ref/heads/$branch" >/dev/null 2>&1; then
            open="$(gh pr list --repo "$MARKETPLACE" --head "$branch" --state open --json url --jq '.[].url')"
            if [ -n "$open" ]; then
              echo "$branch already has a pull request: $open" >&2
              echo "action=none" >>"$GITHUB_OUTPUT"
              echo "pr=$open" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$MARKETPLACE has a branch $branch with no open pull request. Open one for it or delete it, then re-run this job."
            exit 1
          fi
          gh api --method POST "repos/$MARKETPLACE/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$(git rev-parse HEAD)" >/dev/null
          echo "action=commit" >>"$GITHUB_OUTPUT"

      # The marketplace's main requires verified signatures, which a commit
      # made with git on the runner lacks. signed-push commits through the
      # API, which GitHub signs for the App.
      - name: Commit the listing, signed
        if: steps.branch.outputs.action == 'commit'
        uses: releasetools/actions/signed-push@9828828b39bb2261f95b6f45749fb96ce22c9d2d # v0.12.1
        with:
          source-dir: ${{ steps.bump.outputs.staged }}
          target-repo: ${{ env.MARKETPLACE }}
          target-branch: ${{ steps.branch.outputs.name }}
          headline: "chore(worktrees): List ${{ env.TAG }}"
          body: |
            Source-Tag: <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}>
          prune: "false"
          token: ${{ steps.app-token.outputs.token }}

      # Opened as the App, so the marketplace's own checks run on it.
      - name: Open the pull request
        id: open
        if: steps.branch.outputs.action == 'commit'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf '%s\n\n%s\n' \
            "The \`worktrees\` listing installs the plugin from its $TAG tag." \
            "Opened by [$GITHUB_REPOSITORY's publish run]($RUN).")"
          url="$(gh pr create --repo "$MARKETPLACE" --base main --head "$BRANCH" \
            --title "chore(worktrees): List $TAG" --body "$body")"
          echo "$url"
          echo "pr=$url" >>"$GITHUB_OUTPUT"

      # The marketplace's main requires no checks, so the job waits for them
      # itself. They register a few seconds after the pull request opens, and
      # `gh pr checks` reports none until then. A failed check, or none after
      # five minutes, fails the job and leaves the pull request to a person.
      # The squash is pinned to the head the checks ran on.
      - name: Merge the pull request once its checks pass
        if: steps.open.outputs.pr != '' || steps.branch.outputs.pr != ''
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.open.outputs.pr || steps.branch.outputs.pr }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          for _ in $(seq 60); do
            count="$(gh pr checks "$PR" --json name --jq length 2>/dev/null || true)"
            if [ -n "$count" ] && [ "$count" != 0 ]; then break; fi
            sleep 5
          done
          gh pr checks "$PR" --watch --fail-fast --interval 10
          gh pr merge "$PR" --squash --match-head-commit "$head"
